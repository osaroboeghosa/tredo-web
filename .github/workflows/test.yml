name: test
on: {workflow_dispatch: {inputs: {mode: {description: 'dry or write', required: true, default: dry, type: choice, options: [dry, write]}}}}
jobs: {run: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {run: pip install -r requirements.txt}, {name: Run, run: 'python jobs/source_test.py ${{ inputs.mode }}', env: {SUPABASE_URL: '${{ secrets.SUPABASE_URL }}', SUPABASE_SERVICE_KEY: '${{ secrets.SUPABASE_SERVICE_KEY }}'}}]}}
